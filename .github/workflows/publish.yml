name: Release

# npm trusted publishing is configured for this file name: keep the release
# and the publish jobs in publish.yml, and do not call them from another workflow.

on:
  # Each merge into main releases what its fragments describe. The `Release`
  # commit that this workflow pushes with GITHUB_TOKEN starts no new run.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: `auto` follows the fragments; the pre* bumps and prerelease create a prerelease on the `next` npm dist-tag'
        type: choice
        options: [auto, patch, minor, major, prepatch, preminor, premajor, prerelease]
        default: auto
      preid:
        description: 'Prerelease identifier, used by the pre* bumps and prerelease only'
        type: choice
        options: [alpha, beta, rc]
        default: alpha

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Bump version and changelog
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The changelog CLI reads the commit that added each fragment, and the tags.
          fetch-depth: 0

      # Only release the commit that this run checked: when main has moved on,
      # the run of the newer commit releases.
      - name: Check that main has not moved on
        id: head
        run: |
          git fetch --quiet origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::notice::main has moved on since this run started: the newer run releases."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.head.outputs.latest == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      # The CLI of this commit releases itself: the action runs the published
      # package, and this version is not published yet.
      - name: Install, check and build
        if: steps.head.outputs.latest == 'true'
        run: |
          npm ci
          npm run check
          npm run build

      # `auto` gets the next version from the fragments and
      # `.changelog/prerelease` (see "Automatic version" and "Prereleases" in
      # the README). It releases nothing without an entry, except the stable
      # release of a prerelease once the prerelease file is gone. An explicit
      # bump sets the version first. Promoting a prerelease
      # (1.1.0-rc.0 to 1.1.0) can have no new fragment: the prerelease already
      # folded them. A prerelease (with a `-`, e.g. 1.2.0-beta.0) goes to the
      # `next` dist-tag on npm, any other version to `latest`.
      - name: Fold changelog fragments and bump version
        id: version
        if: steps.head.outputs.latest == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          PREID: ${{ inputs.preid || 'alpha' }}
        run: |
          RELEASE_ENV="$RUNNER_TEMP/release.env"
          changelog() { GITHUB_OUTPUT='' node bin/changelog.js release --dotenv "$RELEASE_ENV" "$@"; }
          changed() { [[ "$(sed -n 's/^CHANGELOG_CHANGED=//p' "$RELEASE_ENV")" == true ]]; }
          PREVIOUS="$(node -p 'require("./package.json").version')"
          if [[ $BUMP == auto ]]; then
            changelog --version auto --current "$PREVIOUS"
            if ! changed; then
              echo "::notice::No fragment and no pull request from skip-authors: nothing to release."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="$(sed -n 's/^CHANGELOG_VERSION=//p' "$RELEASE_ENV")"
            npm version "$VERSION" --no-git-tag-version
          else
            npm version "$BUMP" --preid "$PREID" --no-git-tag-version
            VERSION="$(node -p 'require("./package.json").version')"
            changelog --version "$VERSION"
            if ! changed; then
              if [[ $PREVIOUS != *-* || $VERSION == *-* ]]; then
                echo "::error::No fragment in .changelog/: nothing to release."
                exit 1
              fi
              echo "::notice::No fragment in .changelog/: stable release of $PREVIOUS."
            fi
          fi
          if [[ $VERSION == *-* ]]; then
            PRERELEASE=true
            DIST_TAG=next
          else
            PRERELEASE=false
            DIST_TAG=latest
          fi
          {
            echo "released=true"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "dist-tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      # Tags have no `v` prefix. The major tag (`1`) that `uses:
      # weareikko/changelog@1` reads moves to stable releases only.
      - name: Commit, tag and push
        if: steps.version.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "refs/tags/$VERSION"
          if [[ $PRERELEASE != true ]]; then
            MAJOR="${VERSION%%.*}"
            git tag --force "$MAJOR"
            git push --force origin "refs/tags/$MAJOR"
          fi

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # release publishes in the same run. Every step can run again: npm skips a
  # version that it already has, and the GitHub release is updated when it
  # exists. "Re-run failed jobs" on this job publishes what a failed run left.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
      DIST_TAG: ${{ needs.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      # Trusted publishing (OIDC) needs a recent npm: Node.js 24 has one.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      # npm-publish runs with ignore-scripts: build here, not in prepublishOnly.
      - name: Build
        run: |
          npm ci
          npm run build

      # Trusted publishing (OIDC): no npm token.
      - name: Publish @weareikko/changelog
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          access: public
          provenance: true
          tag: ${{ env.DIST_TAG }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: Please refer to [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ env.VERSION }}/CHANGELOG.md) for details.
          prerelease: ${{ env.PRERELEASE }}
          # GitHub's latest release follows the `latest` dist-tag on npm.
          makeLatest: ${{ env.PRERELEASE != 'true' }}
          allowUpdates: true

      # npm can answer a few seconds after the publish that a new version does
      # not exist yet: wait for it before npx installs it.
      - name: Wait for the package on npm
        run: |
          for _ in $(seq 30); do
            npm view "@weareikko/changelog@$VERSION" version --prefer-online | grep -qx "$VERSION" && exit 0
            sleep 5
          done
          echo "::error::@weareikko/changelog@$VERSION is not on npm after 150 seconds."
          exit 1

      # The action of the released tag runs the package that was just published.
      - name: Check the published package with the action
        uses: ./
        with:
          command: check
