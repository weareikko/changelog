name: Release

# npm trusted publishing is configured for this file name: keep the publish
# job in publish.yml, and do not call it from another workflow.

on:
  # Each merge into main releases what its fragments describe. The `Release`
  # commit that this workflow pushes with GITHUB_TOKEN starts no new run.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install and check
        run: |
          npm ci
          npm run check

  # The action of this commit runs the CLI built from this commit: the
  # release uses the code that the test job has just tested.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      # `dist/` and `node_modules/` are ignored: the release commit leaves them out.
      - name: Build
        run: |
          npm ci
          npm run build

      - name: Release
        id: release
        uses: ./
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}
          moving-tags: true

  # "Re-run failed jobs" on this job publishes what a failed run left: npm
  # skips a version that it already has.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      # Trusted publishing (OIDC) needs a recent npm: Node.js 24 has one.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm

      # npm-publish runs with ignore-scripts: build here, not in prepublishOnly.
      - name: Build
        run: |
          npm ci
          npm run build

      # Trusted publishing (OIDC): no npm token.
      - name: Publish @weareikko/changelog
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
