name: 'Changelog fragments'
description: 'Validate `.changelog/` fragments on pull requests and fold them into CHANGELOG.md at release time.'
author: 'Ikko'
branding:
  icon: 'list'
  color: 'blue'

inputs:
  command:
    description: '`check` validates the fragments (and requires one on pull requests when `require-paths` is set). `release` folds them into CHANGELOG.md under `version`.'
    required: true
  version:
    description: 'Version heading for `release`, written as given (e.g. `1.2.0` or `v1.2.0`).'
    required: false
    default: ''
  require-paths:
    description: '`check` on a pull request: globs, one per line or comma-separated. When the pull request changes a matching file, it must add or edit a fragment.'
    required: false
    default: ''
  skip-label:
    description: '`check` on a pull request: label that lifts the fragment requirement. `release`: a pull request from `skip-authors` with this label gets no entry.'
    required: false
    default: 'no-changelog'
  skip-authors:
    description: 'Logins, one per line or comma-separated. `check` on a pull request: their pull requests need no fragment. `release`: their pull requests merged since the previous tag become `Dependencies` entries.'
    required: false
    default: 'renovate[bot]'
  locale:
    description: 'Section names: `en` (`Added`, `Changed`, …, `Dependencies`) or `fr` (`Ajouté`, `Modifié`, …, `Dépendances`).'
    required: false
    default: 'en'
  github-token:
    description: 'Token for the GitHub API: `release` finds the pull request of each fragment and of each commit since the previous tag.'
    required: false
    default: ${{ github.token }}

outputs:
  changed:
    description: '`release`: `true` when CHANGELOG.md got a new section, `false` when there was no fragment and no pull request from `skip-authors`.'
    value: ${{ steps.run.outputs.changed }}
  body:
    description: '`release`: the new section without its `##` heading, e.g. for a GitHub Release body.'
    value: ${{ steps.run.outputs.body }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '24'

    # The action runs the npm package at the version of its own package.json,
    # so an action pinned to a commit runs the CLI of that commit.
    - name: Run changelog ${{ inputs.command }}
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHANGELOG_COMMAND: ${{ inputs.command }}
        CHANGELOG_RELEASE_VERSION: ${{ inputs.version }}
        CHANGELOG_REQUIRE_PATHS: ${{ inputs.require-paths }}
        CHANGELOG_SKIP_LABEL: ${{ inputs.skip-label }}
        CHANGELOG_SKIP_AUTHORS: ${{ inputs.skip-authors }}
        CHANGELOG_LOCALE: ${{ inputs.locale }}
      run: |
        set -euo pipefail
        PACKAGE_VERSION="$(node -p 'require(process.env.GITHUB_ACTION_PATH + "/package.json").version')"
        case "$CHANGELOG_COMMAND" in
          check)
            # `check` lists the files of the pull request with `git diff <base>...HEAD`:
            # complete a shallow checkout (the default of actions/checkout) first.
            if [[ -n $CHANGELOG_REQUIRE_PATHS && $GITHUB_EVENT_NAME == pull_request* ]] \
              && [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
              git fetch --no-tags --quiet --unshallow origin
            fi
            npx --yes "@weareikko/changelog@$PACKAGE_VERSION" check
            ;;
          release)
            npx --yes "@weareikko/changelog@$PACKAGE_VERSION" release --version "$CHANGELOG_RELEASE_VERSION"
            ;;
          *)
            echo "::error::Unknown command \"$CHANGELOG_COMMAND\". Use check or release."
            exit 1
            ;;
        esac
