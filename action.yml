name: 'Changelog fragments'
description: 'Validate `.changelog/` fragments on pull requests. Release on each merge: fold them into CHANGELOG.md, bump, tag and create the GitHub release.'
author: 'Ikko'
branding:
  icon: 'list'
  color: 'blue'

inputs:
  command:
    description: '`check` validates the fragments (and requires one on pull requests when `require-paths` is set). `release` folds them into CHANGELOG.md under `version`, sets the version of `package.json`, commits, tags, pushes and creates the GitHub release.'
    required: true
  version:
    description: '`release`: `auto` computes the next version from the entries and the highest version tag; `calver` gives `YYYY.M.MICRO` from the date and the tags of its month; `patch`, `minor` or `major` bumps that tag; any other value is the version, written as given (e.g. `1.2.0`).'
    required: false
    default: 'auto'
  heading-prefix:
    description: '`release`: text before the version in the `CHANGELOG.md` heading, not in the tag (`v` gives `## v1.2.0`).'
    required: false
    default: ''
  commit-message:
    description: '`release`: message of the release commit; `{version}` is replaced by the version.'
    required: false
    default: 'Release {version}'
  moving-tags:
    description: '`release`: `true` moves the major (`1`) and minor (`1.2`) tags to each stable release, for a repository that is a GitHub Action.'
    required: false
    default: 'false'
  require-paths:
    description: '`check` on a pull request: globs, one per line or comma-separated. When the pull request changes a matching file, it must add or edit a fragment.'
    required: false
    default: ''
  skip-label:
    description: '`check` on a pull request: label that lifts the fragment requirement. `release`: a pull request from `skip-authors` with this label gets no entry.'
    required: false
    default: 'no-changelog'
  skip-authors:
    description: 'Logins, one per line or comma-separated. `check` on a pull request: their pull requests need no fragment. `release`: their pull requests merged since the previous tag become `Dependencies` entries.'
    required: false
    default: 'renovate[bot]'
  locale:
    description: 'Section names: `en` (`Added`, `Changed`, …, `Dependencies`) or `fr` (`Ajouté`, `Modifié`, …, `Dépendances`).'
    required: false
    default: 'en'
  github-token:
    description: 'Token for the GitHub API: `release` finds the pull request of each fragment and of each commit since the previous tag, and creates the GitHub release.'
    required: false
    default: ${{ github.token }}

outputs:
  changed:
    description: '`release`: `true` when CHANGELOG.md got a new section, `false` when there was no fragment and no pull request from `skip-authors`.'
    value: ${{ steps.run.outputs.changed }}
  version:
    description: '`release`: the released version, also its tag (empty when there is nothing to release).'
    value: ${{ steps.run.outputs.version }}
  body:
    description: '`release`: the new section without its `##` heading.'
    value: ${{ steps.run.outputs.body }}
  prerelease:
    description: '`release`: `true` for a prerelease version (with a `-`, e.g. `1.2.0-rc.0`), else `false`.'
    value: ${{ steps.push.outputs.prerelease }}
  dist-tag:
    description: '`release`: the npm dist-tag of the version: `next` for a prerelease, else `latest`.'
    value: ${{ steps.push.outputs.dist-tag }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '24'

    # The action runs the npm package at the version of its own package.json,
    # so an action pinned to a commit runs the CLI of that commit. A checkout
    # of this repository with a build (`uses: ./` after `npm run build`) runs
    # its own CLI instead: `dist/` is never in the published action.
    - name: Run changelog ${{ inputs.command }}
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHANGELOG_COMMAND: ${{ inputs.command }}
        CHANGELOG_RELEASE_VERSION: ${{ inputs.version }}
        CHANGELOG_HEADING_PREFIX: ${{ inputs.heading-prefix }}
        CHANGELOG_REQUIRE_PATHS: ${{ inputs.require-paths }}
        CHANGELOG_SKIP_LABEL: ${{ inputs.skip-label }}
        CHANGELOG_SKIP_AUTHORS: ${{ inputs.skip-authors }}
        CHANGELOG_LOCALE: ${{ inputs.locale }}
      run: |
        set -euo pipefail
        if [[ -f "$GITHUB_ACTION_PATH/dist/cli.js" ]]; then
          changelog() { node "$GITHUB_ACTION_PATH/bin/changelog.js" "$@"; }
        else
          PACKAGE_VERSION="$(node -p 'require(process.env.GITHUB_ACTION_PATH + "/package.json").version')"
          # `--prefix` keeps npx away from the package.json of the working
          # directory: in a clone of this repository at that version, npx
          # otherwise runs the bin of the root project, which is not linked.
          changelog() { npx --yes --prefix "$RUNNER_TEMP" "@weareikko/changelog@$PACKAGE_VERSION" "$@"; }
        fi
        case "$CHANGELOG_COMMAND" in
          check)
            # `check` lists the files of the pull request with `git diff <base>...HEAD`:
            # complete a shallow checkout (the default of actions/checkout) first.
            if [[ -n $CHANGELOG_REQUIRE_PATHS && $GITHUB_EVENT_NAME == pull_request* ]] \
              && [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
              git fetch --no-tags --quiet --unshallow origin
            fi
            changelog check
            ;;
          release)
            # Release the commit of this run only: when the branch has moved on,
            # the run of the newer commit releases.
            if [[ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" != "$(git rev-parse HEAD)" ]]; then
              echo "::notice::$GITHUB_REF_NAME has moved on since this run started: the run of the newer commit releases."
              printf 'changed=false\nversion=\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # `release` reads the tags and the commit that added each fragment.
            UNSHALLOW=()
            if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then UNSHALLOW=(--unshallow); fi
            git fetch --quiet --force --tags "${UNSHALLOW[@]}" origin
            changelog release --version "$CHANGELOG_RELEASE_VERSION"
            ;;
          *)
            echo "::error::Unknown command \"$CHANGELOG_COMMAND\". Use check or release."
            exit 1
            ;;
        esac

    # A tag pushed with GITHUB_TOKEN does not start other workflows: publish
    # from a job of the same workflow that `needs` this one.
    - name: Commit, tag and push the release
      id: push
      if: inputs.command == 'release' && steps.run.outputs.version != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ steps.run.outputs.version }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        MOVING_TAGS: ${{ inputs.moving-tags }}
      run: |
        set -euo pipefail
        # A package.json without a version (tooling only) keeps its form.
        if [[ -f package.json ]] && node -e 'process.exit(require("./package.json").version ? 0 : 1)'; then
          WORKSPACES=()
          if node -e 'process.exit(require("./package.json").workspaces ? 0 : 1)'; then
            WORKSPACES=(--workspaces --include-workspace-root)
          fi
          npm version "$VERSION" --no-git-tag-version "${WORKSPACES[@]}"
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add --update
        git commit --quiet --message "${COMMIT_MESSAGE//'{version}'/$VERSION}"
        git tag "$VERSION"
        git push --quiet origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$VERSION"

        PRERELEASE=false
        DIST_TAG=latest
        if [[ $VERSION == *-* ]]; then
          PRERELEASE=true
          DIST_TAG=next
        fi
        printf 'prerelease=%s\ndist-tag=%s\n' "$PRERELEASE" "$DIST_TAG" >> "$GITHUB_OUTPUT"

        if [[ $MOVING_TAGS == true && $PRERELEASE == false ]]; then
          for TAG in "${VERSION%%.*}" "${VERSION%.*}"; do
            git tag --force "$TAG"
            git push --quiet --force origin "refs/tags/$TAG"
          done
        fi

        # GitHub marks the release with the highest version as the latest.
        RELEASE_OPTIONS=()
        if [[ $PRERELEASE == true ]]; then RELEASE_OPTIONS=(--prerelease); fi
        gh release create "$VERSION" --verify-tag --title "$VERSION" "${RELEASE_OPTIONS[@]}" \
          --notes "Please refer to [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$VERSION/CHANGELOG.md) for details."
